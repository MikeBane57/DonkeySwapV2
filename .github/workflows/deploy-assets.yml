# Build frontend and upload only public/build to Bluehost via FTP.
# Uses same secrets as deploy-bluehost: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_DIR
# FTP_REMOTE_DIR = app root on server (e.g. /public_html/DonkeySwapV2)

name: Deploy frontend assets

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.*'
      - '.github/workflows/deploy-assets.yml'

jobs:
  deploy-assets:
    name: Build and upload public/build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install and build
        run: npm ci && npm run build

      - name: Upload public/build to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/build/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/public/build/
          protocol: ftps
          port: 21
          security: loose
          timeout: 60000
