# Single CI pipeline: lint + test once per push/PR. On main, deploy reuses the built frontend.
name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHP style (Pint)
        run: composer lint:check

      - name: Frontend format
        run: npm run format:check

      - name: Frontend lint
        run: npm run lint:check

      - name: Build frontend
        env:
          VITE_APP_VERSION: 2.1.${{ github.run_number }}
        run: npm run build

      - name: Tests
        run: php artisan test

      - name: Upload frontend build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          retention-days: 1

  deploy:
    name: Upload assets and deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Verify deploy secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.FTP_SERVER }}" ] && missing="$missing FTP_SERVER"
          [ -z "${{ secrets.FTP_USERNAME }}" ] && missing="$missing FTP_USERNAME"
          [ -z "${{ secrets.FTP_PASSWORD }}" ] && missing="$missing FTP_PASSWORD"
          [ -z "${{ secrets.FTP_REMOTE_DIR }}" ] && missing="$missing FTP_REMOTE_DIR"
          [ -z "${{ secrets.SSH_HOST }}" ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SERVER_APP_PATH }}" ] && missing="$missing SERVER_APP_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets (repo Settings → Secrets and variables → Actions):$missing"
            echo "See SECRETS-CHECKLIST.md in the repo for what each secret should be."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build/

      - name: Upload public/build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/build/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/public/build/
          protocol: ftp
          port: 21
          timeout: 60000

      - name: Deploy on server (git pull + composer + migrate + optimize)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            PHP=/opt/cpanel/ea-php84/root/usr/bin/php
            COMPOSER=/opt/cpanel/composer/bin/composer
            cd ${{ secrets.SERVER_APP_PATH }}
            echo "==> git pull"
            git pull origin main
            echo "==> composer install"
            $PHP $COMPOSER install --no-dev --optimize-autoloader --no-interaction
            echo "==> migrate"
            $PHP artisan migrate --force
            echo "==> optimize (config, events, routes, views)"
            $PHP artisan optimize
