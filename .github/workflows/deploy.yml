# One push from Cursor → lint + test, then deploy only if both pass.
# Requires secrets: FTP_* (for assets), SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SERVER_APP_PATH

name: Deploy (push = deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows "Run workflow" in Actions tab to re-deploy without pushing

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci
      - name: Run Pint
        run: composer lint
      - name: Format Frontend
        run: npm run format
      - name: Lint Frontend
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node Dependencies
        run: npm ci
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Copy Environment File
        run: cp .env.example .env
      - name: Generate Application Key
        run: php artisan key:generate
      - name: Build Assets
        run: npm run build
      - name: Tests
        run: ./vendor/bin/pest

  deploy:
    name: Build, upload assets, deploy on server
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15

    steps:
      - name: Verify deploy secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.FTP_SERVER }}" ] && missing="$missing FTP_SERVER"
          [ -z "${{ secrets.FTP_USERNAME }}" ] && missing="$missing FTP_USERNAME"
          [ -z "${{ secrets.FTP_PASSWORD }}" ] && missing="$missing FTP_PASSWORD"
          [ -z "${{ secrets.FTP_REMOTE_DIR }}" ] && missing="$missing FTP_REMOTE_DIR"
          [ -z "${{ secrets.SSH_HOST }}" ] && missing="$missing SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ] && missing="$missing SSH_USER"
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SERVER_APP_PATH }}" ] && missing="$missing SERVER_APP_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets (repo Settings → Secrets and variables → Actions):$missing"
            echo "See SECRETS-CHECKLIST.md in the repo for what each secret should be."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, json, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Prepare .env for build
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build frontend
        env:
          VITE_APP_VERSION: 2.1.${{ github.run_number }}
        run: npm ci && npm run build

      - name: Upload public/build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/build/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/public/build/
          protocol: ftp
          port: 21
          timeout: 60000

      # Server: pull code, install deps, migrate, then optimize (config + events + routes + views).
      # set -e: any failing command fails the deploy so migrations/caches are not silently skipped.
      - name: Deploy on server (git pull + composer + migrate + optimize)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            PHP=/opt/cpanel/ea-php84/root/usr/bin/php
            COMPOSER=/opt/cpanel/composer/bin/composer
            cd ${{ secrets.SERVER_APP_PATH }}
            echo "==> git pull"
            git pull origin main
            echo "==> composer install"
            $PHP $COMPOSER install --no-dev --optimize-autoloader --no-interaction
            echo "==> migrate"
            $PHP artisan migrate --force
            echo "==> optimize (config, events, routes, views)"
            $PHP artisan optimize
